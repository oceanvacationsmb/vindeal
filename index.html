<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VINDeal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>VINDeal</h1>
      <p>Find real lease deals near you.</p>
    </div>
  </header>

  <main class="container">
    <section class="search-panel">
      <h2>Search Lease Deals</h2>

      <div class="form-grid">
        <div class="field">
          <label>ZIP Code</label>
          <input id="zipCode" type="text" value="29577" />
        </div>

        <div class="field">
          <label>Distance</label>
          <select id="radius">
            <option value="25">25 miles</option>
            <option value="50" selected>50 miles</option>
            <option value="100">100 miles</option>
            <option value="250">250 miles</option>
            <option value="500">500 miles</option>
            <option value="1000">1000 miles</option>
            <option value="3000">Nationwide</option>
          </select>
        </div>

        <div class="field">
          <label>Registering State</label>
          <select id="registrationState">
            <option value="SC" selected>South Carolina</option>
            <option value="NC">North Carolina</option>
            <option value="GA">Georgia</option>
            <option value="FL">Florida</option>
            <option value="VA">Virginia</option>
            <option value="NY">New York</option>
            <option value="NJ">New Jersey</option>
            <option value="CA">California</option>
            <option value="TX">Texas</option>
          </select>
        </div>

        <div class="field">
          <label>Make</label>
          <select id="brand" onchange="updateModelOptions()"></select>
        </div>

        <div class="field">
          <label>Model</label>
          <select id="model" onchange="updateTrimOptions()"></select>
        </div>

        <div class="field">
          <label>Trim</label>
          <select id="trim"></select>
        </div>

        <div class="field">
          <label>Lease Term</label>
          <select id="term">
            <option value="24">24 months</option>
            <option value="36" selected>36 months</option>
            <option value="39">39 months</option>
            <option value="48">48 months</option>
          </select>
        </div>

        <div class="field">
          <label>Miles Per Year</label>
          <select id="miles">
            <option value="7500">7,500</option>
            <option value="10000" selected>10,000</option>
            <option value="12000">12,000</option>
            <option value="15000">15,000</option>
          </select>
        </div>
      </div>

      <details class="advanced-box">
        <summary>Optional filters</summary>

        <div class="form-grid">
          <div class="field">
            <label>Exterior Color</label>
            <select id="exteriorColor">
              <option value="Any" selected>Any</option>
              <option value="White">White</option>
              <option value="Black">Black</option>
              <option value="Gray">Gray</option>
              <option value="Silver">Silver</option>
              <option value="Blue">Blue</option>
              <option value="Red">Red</option>
              <option value="Green">Green</option>
            </select>
          </div>

          <div class="field">
            <label>Interior Color</label>
            <select id="interiorColor">
              <option value="Any" selected>Any</option>
              <option value="Black">Black</option>
              <option value="Gray">Gray</option>
              <option value="Beige">Beige</option>
              <option value="Brown">Brown</option>
              <option value="White">White</option>
            </select>
          </div>

          <div class="field">
            <label>Year</label>
            <select id="year"></select>
          </div>

          <div class="field">
            <label>Features</label>
            <input id="features" type="text" placeholder="AWD, captains chairs, pano roof" />
          </div>
        </div>
      </details>

      <button id="scanBtn" onclick="scanBackendInventory()">Search Deals</button>
    </section>

    <section class="summary-row">
      <div class="summary-card">
        <span>Dealers</span>
        <strong id="dealerCount">0</strong>
      </div>

      <div class="summary-card">
        <span>Cars</span>
        <strong id="vehicleCount">0</strong>
      </div>

      <div class="summary-card">
        <span>Program</span>
        <strong id="programStatus">Not checked</strong>
      </div>
    </section>

    <section id="programBox" class="program-box hidden"></section>

    <section>
      <h2>Results</h2>
      <div id="vehicleList" class="vehicle-grid"></div>
    </section>
  </main>

  <script src="app.js?v=12"></script>
</body>
</html>
