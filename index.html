<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VINDeal - Lease Deal Hunter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>VINDeal</h1>
      <p>Real inventory lease deal hunter</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Search Inventory</h2>

      <div class="grid">
        <div class="field">
          <label>ZIP Code</label>
          <input id="zipCode" value="29577" />
        </div>

        <div class="field">
          <label>Radius</label>
          <select id="radius">
            <option value="50">50 miles</option>
            <option value="100">100 miles</option>
            <option value="250" selected>250 miles</option>
            <option value="500">500 miles</option>
          </select>
        </div>

        <div class="field">
          <label>Make</label>
          <select id="brand" onchange="updateModelOptions()">
            <option value="Hyundai" selected>Hyundai</option>
            <option value="Kia">Kia</option>
            <option value="Honda">Honda</option>
          </select>
        </div>

        <div class="field">
          <label>Model</label>
          <select id="model" onchange="updateTrimOptions()"></select>
        </div>

        <div class="field">
          <label>Trim</label>
          <select id="trim"></select>
        </div>

        <div class="field">
          <label>Year</label>
          <select id="year">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
            <option value="2027">2027</option>
          </select>
        </div>

        <div class="field">
          <label>Exterior Color</label>
          <select id="exteriorColor">
            <option value="Any" selected>Any</option>
            <option value="White">White</option>
            <option value="Black">Black</option>
            <option value="Gray">Gray</option>
            <option value="Silver">Silver</option>
            <option value="Blue">Blue</option>
            <option value="Red">Red</option>
            <option value="Green">Green</option>
          </select>
        </div>

        <div class="field">
          <label>Interior Color</label>
          <select id="interiorColor">
            <option value="Any" selected>Any</option>
            <option value="Black">Black</option>
            <option value="Gray">Gray</option>
            <option value="Beige">Beige</option>
            <option value="Brown">Brown</option>
            <option value="White">White</option>
          </select>
        </div>
      </div>

      <h3>Lease Program</h3>

      <div class="grid">
        <div class="field">
          <label>Manufacturer Rebate</label>
          <select id="manufacturerRebate">
            <option value="0">$0</option>
            <option value="5000">$5,000</option>
            <option value="7500">$7,500</option>
            <option value="10000" selected>$10,000</option>
            <option value="12700">$12,700</option>
          </select>
        </div>

        <div class="field">
          <label>Lease Cash</label>
          <select id="leaseCash">
            <option value="0" selected>$0</option>
            <option value="1000">$1,000</option>
            <option value="2000">$2,000</option>
            <option value="3000">$3,000</option>
            <option value="5000">$5,000</option>
          </select>
        </div>

        <div class="field">
          <label>EV Credit</label>
          <select id="evCredit">
            <option value="0" selected>$0</option>
            <option value="7500">$7,500</option>
          </select>
        </div>

        <div class="field">
          <label>Loyalty Cash</label>
          <select id="loyaltyCash">
            <option value="0" selected>$0</option>
            <option value="500">$500</option>
            <option value="1000">$1,000</option>
            <option value="1500">$1,500</option>
            <option value="2000">$2,000</option>
          </select>
        </div>

        <div class="field">
          <label>Residual %</label>
          <select id="residualPercent">
            <option value="50">50%</option>
            <option value="52">52%</option>
            <option value="54">54%</option>
            <option value="56">56%</option>
            <option value="58" selected>58%</option>
            <option value="60">60%</option>
            <option value="62">62%</option>
            <option value="64">64%</option>
          </select>
        </div>

        <div class="field">
          <label>Money Factor</label>
          <select id="moneyFactor">
            <option value="0.00150">0.00150</option>
            <option value="0.00180">0.00180</option>
            <option value="0.00200">0.00200</option>
            <option value="0.00222" selected>0.00222</option>
            <option value="0.00250">0.00250</option>
            <option value="0.00300">0.00300</option>
          </select>
        </div>

        <div class="field">
          <label>Term</label>
          <select id="term">
            <option value="24">24 months</option>
            <option value="36" selected>36 months</option>
            <option value="39">39 months</option>
            <option value="48">48 months</option>
          </select>
        </div>

        <div class="field">
          <label>Miles</label>
          <select id="miles">
            <option value="7500">7,500</option>
            <option value="10000" selected>10,000</option>
            <option value="12000">12,000</option>
            <option value="15000">15,000</option>
          </select>
        </div>
      </div>

      <button class="search-btn" onclick="scanBackendInventory()">Scan Dealers</button>
    </section>

    <section class="summary-grid">
      <div class="summary-card">
        <span>Total Vehicles</span>
        <strong id="totalVehicles">0</strong>
      </div>

      <div class="summary-card">
        <span>Best Payment</span>
        <strong id="bestPayment">$0</strong>
      </div>

      <div class="summary-card">
        <span>Best Discount</span>
        <strong id="bestDiscount">$0</strong>
      </div>

      <div class="summary-card">
        <span>Avg Payment</span>
        <strong id="avgPayment">$0</strong>
      </div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Vehicles</h2>
        <button onclick="clearVehicles()">Clear</button>
      </div>

      <div id="vehiclesList" class="vehicles-list">
        <p class="empty">No vehicles yet. Click Scan Dealers.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
