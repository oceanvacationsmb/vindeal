<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VINDeal - Lease Deal Hunter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>VINDeal</h1>
      <p>Find lease deals near you and invite dealers to bid.</p>
    </div>
  </header>

  <main class="container">
    <section class="search-panel">
      <h2>Find My Lease Deal</h2>

      <div class="form-grid simple-grid">
        <div class="field">
          <label for="zipCode">ZIP Code</label>
          <input id="zipCode" type="text" placeholder="29577" value="29577" />
        </div>

        <div class="field">
          <label for="radius">Distance</label>
          <select id="radius">
            <option value="25">25 miles</option>
            <option value="50" selected>50 miles</option>
            <option value="100">100 miles</option>
            <option value="250">250 miles</option>
            <option value="500">500 miles</option>
            <option value="1000">1000 miles</option>
            <option value="3000">Nationwide</option>
          </select>
        </div>

        <div class="field">
          <label for="registrationState">Registering State</label>
          <select id="registrationState">
            <option value="SC" selected>South Carolina</option>
            <option value="NC">North Carolina</option>
            <option value="GA">Georgia</option>
            <option value="FL">Florida</option>
            <option value="VA">Virginia</option>
            <option value="NY">New York</option>
            <option value="NJ">New Jersey</option>
            <option value="CA">California</option>
            <option value="TX">Texas</option>
          </select>
        </div>

        <div class="field">
          <label for="brand">Make</label>
          <select id="brand" onchange="updateModelOptions()">
            <option value="Hyundai" selected>Hyundai</option>
            <option value="Kia">Kia</option>
            <option value="Honda">Honda</option>
          </select>
        </div>

        <div class="field">
          <label for="model">Model</label>
          <select id="model" onchange="updateTrimOptions()"></select>
        </div>

        <div class="field">
          <label for="trim">Trim</label>
          <select id="trim"></select>
        </div>

        <div class="field">
          <label for="term">Lease Term</label>
          <select id="term">
            <option value="24">24 months</option>
            <option value="36" selected>36 months</option>
            <option value="39">39 months</option>
            <option value="48">48 months</option>
          </select>
        </div>

        <div class="field">
          <label for="miles">Miles Per Year</label>
          <select id="miles">
            <option value="7500">7,500</option>
            <option value="10000" selected>10,000</option>
            <option value="12000">12,000</option>
            <option value="15000">15,000</option>
          </select>
        </div>
      </div>

      <details class="advanced-box">
        <summary>Optional filters</summary>

        <div class="form-grid">
          <div class="field">
            <label for="exteriorColor">Exterior Color</label>
            <select id="exteriorColor">
              <option value="Any" selected>Any</option>
              <option value="White">White</option>
              <option value="Black">Black</option>
              <option value="Gray">Gray</option>
              <option value="Silver">Silver</option>
              <option value="Blue">Blue</option>
              <option value="Red">Red</option>
              <option value="Green">Green</option>
            </select>
          </div>

          <div class="field">
            <label for="interiorColor">Interior Color</label>
            <select id="interiorColor">
              <option value="Any" selected>Any</option>
              <option value="Black">Black</option>
              <option value="Gray">Gray</option>
              <option value="Beige">Beige</option>
              <option value="Brown">Brown</option>
              <option value="White">White</option>
            </select>
          </div>

          <div class="field">
            <label for="year">Year</label>
            <select id="year">
              <option value="2026" selected>2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
            </select>
          </div>

          <div class="field">
            <label for="features">Must-have features</label>
            <input id="features" type="text" placeholder="Example: captains chairs, AWD, pano roof" />
          </div>
        </div>
      </details>

      <button id="scanBtn" onclick="scanBackendInventory()">Search Deals</button>
    </section>

    <section class="summary-row">
      <div class="summary-card">
        <span>Dealers Scanned</span>
        <strong id="dealerCount">0</strong>
      </div>

      <div class="summary-card">
        <span>Cars Found</span>
        <strong id="vehicleCount">0</strong>
      </div>

      <div class="summary-card">
        <span>Lease Program</span>
        <strong id="programStatus">Not checked</strong>
      </div>
    </section>

    <section id="programBox" class="program-box hidden"></section>

    <section>
      <h2>Results</h2>
      <div id="vehicleList" class="vehicle-list"></div>
    </section>
  </main>

  <script src="app.js?v=10"></script>
</body>
</html>
