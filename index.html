<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VINDeal - Lease Deal Hunter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>VINDeal</h1>
      <p>Real inventory lease deal hunter</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Search Inventory</h2>

      <div class="grid">
        <div class="field">
          <label>ZIP Code</label>
          <input id="zipCode" value="29577" />
        </div>

        <div class="field">
          <label>Radius</label>
          <input id="radius" type="number" value="250" />
        </div>

        <div class="field">
          <label>Brand</label>
          <select id="brand">
            <option value="Hyundai" selected>Hyundai</option>
          </select>
        </div>

        <div class="field">
          <label>Model</label>
          <input id="model" value="IONIQ 9" />
        </div>

        <div class="field">
          <label>Trim</label>
          <select id="trim">
            <option value="Any" selected>Any</option>
            <option value="S">S</option>
            <option value="SE">SE</option>
            <option value="SEL">SEL</option>
            <option value="Limited">Limited</option>
            <option value="Performance Limited">Performance Limited</option>
            <option value="Calligraphy">Calligraphy</option>
          </select>
        </div>

        <div class="field">
          <label>Year</label>
          <input id="year" type="number" value="2026" />
        </div>

        <div class="field">
          <label>Exterior Color</label>
          <input id="exteriorColor" value="Any" />
        </div>

        <div class="field">
          <label>Interior Color</label>
          <input id="interiorColor" value="Any" />
        </div>
      </div>

      <h3>Lease Program</h3>

      <div class="grid">
        <div class="field">
          <label>Manufacturer Rebate</label>
          <input id="manufacturerRebate" type="number" value="10000" />
        </div>

        <div class="field">
          <label>Lease Cash</label>
          <input id="leaseCash" type="number" value="0" />
        </div>

        <div class="field">
          <label>EV Credit</label>
          <input id="evCredit" type="number" value="0" />
        </div>

        <div class="field">
          <label>Loyalty Cash</label>
          <input id="loyaltyCash" type="number" value="0" />
        </div>

        <div class="field">
          <label>Residual %</label>
          <input id="residualPercent" type="number" value="58" />
        </div>

        <div class="field">
          <label>Money Factor</label>
          <input id="moneyFactor" type="number" step="0.00001" value="0.00222" />
        </div>

        <div class="field">
          <label>Term</label>
          <input id="term" type="number" value="36" />
        </div>

        <div class="field">
          <label>Miles</label>
          <input id="miles" type="number" value="10000" />
        </div>
      </div>

      <button class="search-btn" onclick="scanBackendInventory()">Scan Dealers</button>
    </section>

    <section class="summary-grid">
      <div class="summary-card">
        <span>Total Vehicles</span>
        <strong id="totalVehicles">0</strong>
      </div>

      <div class="summary-card">
        <span>Best Payment</span>
        <strong id="bestPayment">$0</strong>
      </div>

      <div class="summary-card">
        <span>Best Discount</span>
        <strong id="bestDiscount">$0</strong>
      </div>

      <div class="summary-card">
        <span>Avg Payment</span>
        <strong id="avgPayment">$0</strong>
      </div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Vehicles</h2>
        <button onclick="clearVehicles()">Clear</button>
      </div>

      <div id="vehiclesList" class="vehicles-list">
        <p class="empty">No vehicles yet. Click Scan Dealers.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
